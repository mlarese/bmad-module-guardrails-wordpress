# Agent customization surface for grl-agent-wordpress.
# Team overrides:     {project-root}/_bmad/custom/grl-agent-wordpress.toml
# Personal overrides: {project-root}/_bmad/custom/grl-agent-wordpress.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "wordpress"
module = "gwp"
team = "software-development"
name = "Milo"
title = "WordPress Component Architect"
icon = "🧩"
description = "Progetta e implementa WordPress a componenti con Gutenberg, Elementor, ACF, campi custom, template e Media Library, senza lasciare contenuti strutturati dentro pagine monolitiche o asset fuori da WordPress."
agent_type = "stateless"   # stateless | memory | autonomous
